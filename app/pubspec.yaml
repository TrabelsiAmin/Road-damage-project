name: tariqmap
publish_to: 'none'
description: Offline-first road damage inspection for Tunisia.
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  uuid: ^4.5.1
  intl: ^0.19.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  http: ^1.6.0
  crypto: ^3.0.3
  # On-device ML inference (Android / iOS only; web uses mock fallback)
  tflite_flutter: ^0.11.0
  # Live camera stream
  camera: ^0.11.0
  # Image resizing and tensor preprocessing
  image: ^4.5.4
  # Offline SQLite persistence
  sqflite: ^2.3.3+1
  path: ^1.9.0
  # Video import and frame sampling
  video_player: ^2.9.2
  file_picker: ^8.1.4
  # Real frame extraction from video (replaces the proxy/workaround)
  video_thumbnail: ^0.5.3
  # FFmpeg — stitch annotated frames back into an annotated output video
  # Using the maintained community fork (original ffmpeg_kit_flutter was discontinued)
  ffmpeg_kit_flutter_new: ^4.6.2
  # Save annotated video to device gallery
  saver_gallery: ^3.0.6
  # Typography
  google_fonts: ^6.2.1
  # Share annotated images / videos
  share_plus: ^10.1.4
  # Permission flows
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
