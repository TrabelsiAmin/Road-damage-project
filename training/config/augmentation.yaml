# Road-image augmentation configuration for TariqMap YOLOv8 training.
# Applied via Ultralytics YOLO augmentation parameters.
# These settings are appropriate for road surface detection on mobile cameras.

augmentation:
  # Geometric augmentations
  degrees: 5.0           # Max rotation (road images must stay roughly horizontal)
  translate: 0.1         # Image translation fraction
  scale: 0.3             # Scale variation (+/- 30%)
  shear: 2.0             # Shear (simulates slight camera tilt)
  perspective: 0.0002    # Perspective warp (simulates varying camera angle)
  flipud: 0.0            # No vertical flip (sky must stay up)
  fliplr: 0.5            # Horizontal flip (roads are symmetric)

  # Color / photometric augmentations (critical for mobile cameras)
  hsv_h: 0.015          # Hue variation (±1.5%)
  hsv_s: 0.7            # Saturation variation (±70%) — handles wet/dry roads
  hsv_v: 0.4            # Value/brightness variation (±40%) — handles lighting

  # Noise and blur
  blur: 0.01             # Gaussian blur probability (simulates motion)
  # Note: motion-blur is handled by mosaic + scale; add albumentations for explicit motion-blur

  # Mosaic and mixup
  mosaic: 0.8            # Mosaic augmentation probability (improves small-object recall)
  mixup: 0.05            # MixUp augmentation (light, for generalization)
  copy_paste: 0.0        # Copy-paste (disabled — not useful for road damage shapes)

  # Close-up augmentation
  erasing: 0.2           # Random erasing (simulates occlusions/shadows)

training:
  # Hyperparameters for student model (YOLOv8n)
  epochs: 150
  patience: 30           # Early stopping patience
  batch: 16
  imgsz: 640
  optimizer: SGD
  lr0: 0.01
  lrf: 0.01              # Final learning rate fraction
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_bias_lr: 0.1
  box: 7.5               # Box loss gain
  cls: 0.5               # Class loss gain
  dfl: 1.5               # DFL loss gain
  seed: 42               # Deterministic seed

  # Confidence tuning (per-class, tuned on validation)
  class_confidence_thresholds:
    D00: 0.35
    D10: 0.35
    D20: 0.30
    D40: 0.40            # Potholes: slightly higher threshold to reduce FP
    D50: 0.30
    D60: 0.30
    D90: 0.35

  # Negative sample strategy
  # Mix in 10% negative (no-damage) images per batch to reduce FPR
  negative_sample_fraction: 0.10

notes:
  - "Motion-blur augmentation can be added via Albumentations integration with Ultralytics."
  - "Shadow/rain robustness: achieved via hsv_v variation + mixup + mosaic."
  - "Camera-angle variation: achieved via perspective + shear."
  - "Test split must remain untouched until final evaluation."
  - "D90 (rutting) is visual-only from 2D imagery — no depth measurement."
  - "WP3 pavement (D20/D40) is the first student to train and distill (src.distill)."
  - "augmentation.training describes the student (YOLOv8n); teacher/KD is a later step."
